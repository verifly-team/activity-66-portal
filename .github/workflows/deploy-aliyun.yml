name: Deploy portal to Aliyun ECS

# 构建静态站，然后把 dist/ 覆盖到服务器站点目录。就两步，没有别的。
# push main 自动发布；也可以在 Actions 里手动 Run workflow。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-66-production
  cancel-in-progress: false

env:
  APP_DIR: /verifly/activity-66-portal
  SSH_USER: ${{ secrets.ALIYUN_USER || 'deploy' }}
  SSH_PORT: ${{ secrets.ALIYUN_PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/app.html
          test -f dist/apply.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          cp dist/app.html dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/REVISION
          npm run verify:dist

      - name: Replace files on the server
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "ALIYUN_HOST 或 ALIYUN_SSH_KEY 还没配，只完成构建。"
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          SSH_OPTS="-p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          REMOTE="$SSH_USER@$HOST"

          ssh $SSH_OPTS "$REMOTE" "mkdir -p '$APP_DIR'"
          # --delay-updates 能缩短新旧文件并存的窗口，但目录不是原子切换。
          # 静态站资源量很小，保留这段提示是为了以后改版本目录时别误判。
          #
          # 宝塔自己放在站根目录的文件不能参与删除：acme-challenge 由 root
          # 创建，.user.ini 带 immutable 属性，deploy 用户删不动。
          rsync -az --delete --delay-updates --chmod=D755,F644 \
            --exclude='.well-known' \
            --exclude='.user.ini' \
            -e "ssh $SSH_OPTS" \
            dist/ "$REMOTE:$APP_DIR/"

          echo "Released ${GITHUB_SHA:0:12}"

      - name: Public URL not configured
        if: vars.ALIYUN_PUBLIC_URL == ''
        run: echo "::warning::ALIYUN_PUBLIC_URL 未配置，已跳过发布后线上检查"

      - name: Check the public site
        if: vars.ALIYUN_PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.ALIYUN_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          for path in / /app.html /apply.html; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$path" || echo 000)"
            [ "$code" = "200" ] || { echo "FAIL $path -> $code"; exit 1; }
            echo "ok   $path"
          done
          for page in "" /app.html /apply.html; do
            html="$(curl -fsS --max-time 20 "$base$page")"
            assets="$(
              printf '%s' "$html" \
                | grep -oE '\./assets/[^"]+' \
                | sort -u
            )"
            [ -n "$assets" ] || { echo "FAIL $page has no assets"; exit 1; }
            while IFS= read -r asset; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/${asset#./}" || echo 000)"
              [ "$code" = "200" ] || { echo "FAIL $asset -> $code"; exit 1; }
            done <<< "$assets"
            echo "ok   assets for ${page:-/}"
          done
          live="$(curl -sS --max-time 20 "$base/REVISION" | tr -d '[:space:]' || true)"
          [ "$live" = "$GITHUB_SHA" ] || { echo "FAIL revision: live='$live'"; exit 1; }
          echo "ok   revision ${live:0:12}"
