name: Deploy portal to Aliyun ECS

# Build the static site and rsync dist/ straight into the BaoTa site root.
# No container, no registry, no server-side nginx changes.

# 手动触发：Actions → Deploy portal to Aliyun ECS → Run workflow。
# 全部验证完、准备上线后，再把 push main 加回来改成自动。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-66-production
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.ALIYUN_APP_DIR || '/verifly/activity-66-portal' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check deployment configuration
        id: cfg
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -n "${HOST:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::ALIYUN_HOST is not set, so the site is built but not uploaded."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/app.html
          test -f dist/apply.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          cp dist/app.html dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/REVISION

      - name: Configure SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
          HOST: ${{ secrets.ALIYUN_HOST }}
          PORT: ${{ secrets.ALIYUN_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/activity_66_deploy"
          chmod 600 "$HOME/.ssh/activity_66_deploy"
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Upload site files
        if: steps.cfg.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
          USER: ${{ secrets.ALIYUN_USER || 'deploy' }}
          PORT: ${{ secrets.ALIYUN_PORT || '22' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-p $PORT -i $HOME/.ssh/activity_66_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          REMOTE="$USER@$HOST"

          ssh $SSH_OPTS "$REMOTE" "mkdir -p '$APP_DIR'"
          # --delay-updates stages every file and renames at the end, so the live
          # directory is never a half-written mix of two builds.
          rsync -az --delete --delay-updates --chmod=D755,F644 \
            -e "ssh $SSH_OPTS" \
            dist/ "$REMOTE:$APP_DIR/"

          echo "Released ${GITHUB_SHA:0:12}"

      - name: Verify public site
        if: steps.cfg.outputs.configured == 'true' && vars.ALIYUN_PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.ALIYUN_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          for path in / /app.html /apply.html; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$path" || echo 000)"
            [ "$code" = "200" ] || { echo "FAIL $path -> $code"; exit 1; }
            echo "ok   $path"
          done
          live="$(curl -sS --max-time 20 "$base/REVISION" | tr -d '[:space:]' || true)"
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "FAIL revision: live='$live' expected='$GITHUB_SHA'"
            exit 1
          fi
          echo "ok   revision ${live:0:12}"

      - name: Summary
        if: always()
        run: |
          echo "### activity-66 portal" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ secrets.ALIYUN_HOST || 'not configured' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: \`${{ vars.ALIYUN_PUBLIC_URL || 'not configured' }}\`" >> "$GITHUB_STEP_SUMMARY"
